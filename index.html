<!DOCTYPE html>
<html>
<head>
    <title>Subha - Web Developer</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap');
        
        body { 
            background: #0a0a0a;
            font-family: 'Orbitron', sans-serif; 
            color: #00f0ff; 
            text-align: center; 
            padding: 100px 20px;
            margin: 0;
        }
        .box { 
            background: rgba(0, 240, 255, 0.05);
            padding: 60px 40px;
            border-radius: 15px;
            max-width: 600px;
            margin: 0 auto;
            border: 2px solid #00f0ff;
            box-shadow: 0 0 30px #00f0ff;
        }
        h1 { 
            font-size: 50px; 
            margin-bottom: 20px;
            text-shadow: 0 0 20px #00f0ff;
        }
        p {
            font-size: 20px;
            color: #fff;
            line-height: 1.6;
        }
        .btn { 
            display: inline-block;
            background: transparent;
            color: #00f0ff;
            padding: 15px 35px;
            text-decoration: none;
            border-radius: 8px;
            margin-top: 30px;
            font-size: 18px;
            border: 2px solid #00f0ff;
            transition: 0.3s;
        }
        .btn:hover {
            background: #00f0ff;
            color: #0a0a0a;
            box-shadow: 0 0 20px #00f0ff;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>Hi, I am Subha 👋</h1>
        <p>10th Student | Aspiring Web Developer</p>
        <p>Building my dream, one line of code at a time</p>

    </div>

</html>
