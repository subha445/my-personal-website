
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Subha | Developer Portfolio</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 40px 20px;
  background: #090710;
  color: white;
  font-family: Arial, sans-serif;
}

.container {
  max-width: 850px;
  margin: auto;
}

h1 {
  font-size: 36px;
  color: #c084fc;
  margin-bottom: 10px;
}

.subtitle {
  color: #aaa0b9;
  margin-bottom: 35px;
}

h2 {
  color: #d8b4fe;
  margin-bottom: 20px;
}

.projects {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 18px;
}

.card {
  background: #171222;
  border: 1px solid #58368a;
  border-radius: 12px;
  padding: 22px;
}

.card h3 {
  color: #d8b4fe;
}

.card p {
  color: #c5bdd0;
  line-height: 1.5;
}

.btn {
  display: inline-block;
  background: #9333ea;
  color: white;
  padding: 11px 18px;
  border-radius: 7px;
  text-decoration: none;
  margin-top: 10px;
}

.btn:hover {
  background: #a855f7;
}

footer {
  text-align: center;
  color: #81758e;
  margin-top: 45px;
}
</style>
</head>

<body>
<div class="container">

<h1>Subha.dev</h1>
<p class="subtitle">
Web Developer | Projects & Experiments
</p>

<h2>Featured Projects</h2>

<div class="projects">

<div class="card">
<h3>My Personal Website</h3>
<p>A personal website built using HTML and CSS.</p>
<a class="btn"
href="https://github.com/subha445/my-personal-website">
View on GitHub
</a>
</div>

<!-- Add more project cards here -->

</div>

<footer>
© 2026 Subha | Developer Portfolio
</footer>

</div>
</body>
</html>
